experiment:
  id: "exp02_finetuning_n3200"
  description: "Sample-efficiency ablation of exp02_finetuning: fine-tune on 3200 samples (20 epochs) instead of the full available training split."
  type: "finetuning"
  parent_experiment: "exp02_finetuning"

data:
  # Identical to exp02_finetuning/config.yaml -- reuses the pretraining LMDB as
  # the x-source and joins it with the lean gap-mask LMDB by idx manifest (see
  # model_gap_aware/lmdb_training.py::PretrainGapMaskJoinDataModule). Subsetting to N=3200
  # happens at runtime via --max_samples 3200, passed by
  # scripts/{local,slurm}/train*.sh -- config.yaml has no schema for it (see
  # sentinel/experiments/scripts/run_training.py and
  # sentinel/src/training/gap_aware_training.py: --max_samples is CLI-only).
  train_lmdb:    "${S2_LMDB_PATH}"
  gap_mask_lmdb: "${S2_GAP_FILLING_TRAINING_DIR}/lmdb/gap_masks.lmdb"
  eval_dir:      "${S2_DATA_DIR}/gap_filling"

model:
  # Same pretrained source as exp02_finetuning: exp01_zero_shot's own tracked
  # checkpoint (auto-discovered: lowest MAE_val under pretrained_log_dir).
  pretrained_checkpoint: null
  pretrained_log_dir: "sentinel/lightning_logs/experiments/exp01_zero_shot"

training:
  log_dir: "sentinel/lightning_logs/experiments/exp02_finetuning/sample_ablation/n3200"
  # Same 20 epochs for every variant (and for exp02_finetuning), so only the
  # fine-tuning sample count varies.
  max_epochs: 20
  # devices=4 (shared_config's default): 4-way DDP gives a reasonable
  # per-replica share at this N (n0050/n0100/n0200 use devices=1 instead --
  # see those configs for why 4-way DDP breaks down at that scale).
  devices: 4
  # Must be set explicitly: run_training.py merges shared_config.yaml + this
  # file only, it does NOT chain through parent_experiment. Omitting this
  # would fall back to shared_config.yaml's base_lr=1e-4, which is tuned for
  # training from scratch, not for fine-tuning an already-converged
  # checkpoint. With devices=4, run_training.py's effective lr is
  # 1e-5 * 4 = 4e-5, the same peak LR as exp02_finetuning (4e-5 on 1 GPU).
  base_lr: 1.0e-5
  # warmup_steps: ~1 epoch's worth of steps (n_train // batch_size, not
  # divided by devices), so the LR ramp does not perturb the already-converged
  # checkpoint; floored at 10. At N=3200 (batch_size=8, val_split=0.05):
  # n_train=3040, steps_per_epoch=3040//8=380
  # (see sample_ablation/README.md for the full per-N derivation table).
  warmup_steps: 380

slurm:
  job_name: "exp02_n3200_ft"
