experiment:
  id: "exp02_finetuning"
  description: "Pretrained model fine-tuned on the gap-filling training dataset (fresh optimizer)."
  type: "finetuning"

  parent_experiment: "exp01_zero_shot"

data:
  # The gap-filling training set reuses the pretraining LMDB directly as the
  # x-source (no duplicated image copy) -- see
  # sentinel/src/download_data/sentinel_gapfilling_training_downloader.py.
  # gap_mask_lmdb supplies only the small per-location
  # donor gap mask; (x_gappy, y) are reconstructed at runtime by joining the
  # two via idx manifests (model_gap_aware/lmdb_training.py::
  # PretrainGapMaskJoinDataset). See
  # sentinel/scripts/{local,slurm}/download_gap_filling_training_data.sh and
  # sentinel/src/dataset/create_gap_mask_lmdb.py.
  # Unlike ESDC's exp02, this fine-tunes on the full available training split
  # rather than a fixed N=100 (see sample_ablation/ for the sample-count sweep).
  train_lmdb:    "${S2_LMDB_PATH}"
  gap_mask_lmdb: "${S2_GAP_FILLING_TRAINING_DIR}/lmdb/gap_masks.lmdb"
  eval_dir:      "${S2_DATA_DIR}/gap_filling"

model:
  # Always fine-tune from exp01_zero_shot's own tracked checkpoint (auto-
  # discovered: lowest MAE_val under pretrained_log_dir) -- mirrors ESDC's
  # exp02_finetuning, which deliberately does not source from the separate,
  # non-experiment-tracked standalone pretraining pipeline (different
  # 384/8/6 architecture vs. this family's 192/12/3; see shared_config.yaml).
  pretrained_checkpoint: null
  pretrained_log_dir: "sentinel/lightning_logs/experiments/exp01_zero_shot"

training:
  log_dir: "sentinel/lightning_logs/experiments/exp02_finetuning"
  # Single GPU + a lower, shorter warmup than shared_config.yaml's from-
  # scratch defaults -- fine-tuning perturbs an already-converged checkpoint,
  # so a long high-LR ramp is counterproductive (see ESDC's exp02 config.yaml
  # for the same rationale).
  devices: 1
  base_lr: 4.0e-5
  warmup_steps: 200
  max_epochs: 20

slurm:
  job_name: "exp02_finetune"
