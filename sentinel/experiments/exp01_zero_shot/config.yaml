experiment:
  id: "exp01_zero_shot"
  description: "Pre-trained MaskFeat model evaluated directly on gap-filling — no fine-tuning."
  type: "zero_shot"

  parent_experiment: null

data:
  train_lmdb: "${S2_LMDB_PATH}"  # pre-training LMDB (no synthetic gaps); test split auto-derived (_test.lmdb)
  eval_dir:   "${S2_DATA_DIR}/gap_filling"

model:
  pretrained_checkpoint: null
  pretrained_log_dir: "sentinel/lightning_logs/experiments/exp01_zero_shot"

training:
  gap_only_masking: false  # pre-training uses random masking, not gap-only
  log_dir: "sentinel/lightning_logs/experiments/exp01_zero_shot"

slurm:
  job_name: "exp01_pretrain"
