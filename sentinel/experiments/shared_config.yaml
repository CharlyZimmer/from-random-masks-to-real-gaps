# Shared config for all sentinel experiments.
# ViT-Ti configuration (embed_dim 192, depth 12, num_heads 3), matching
# esdc/experiments/shared_config.yaml — same architecture family used for all
# experiments across both dataset modules.
# Pre-training scripts remain independent — do not reference this file.
#
# Per-experiment configs override only what differs. Merge order:
#   shared_config.yaml  <  experiment/config.yaml  <  CLI flags (local sanity runs)

model:
  patch_size: 4
  embed_dim: 192
  depth: 12
  num_heads: 3
  decoder_heads: 1
  loss_type: "mae"
  pretrained_checkpoint: null  # exp02 overrides with its own auto-discovered checkpoint

training:
  max_epochs: 50
  batch_size: 8
  num_workers: 6
  val_split: 0.05
  base_lr: 1.0e-4
  warmup_steps: 10000
  accumulate_grad_batches: 1
  gap_only_masking: true       # exp01 overrides to false (pre-training uses random masking)
  precision: "16-mixed"
  accelerator: "cuda"
  devices: 4
  # log_dir: experiment-specific

slurm:
  partition: "clara"
  gres: "gpu:rtx2080ti:4"
  nodes: 1
  ntasks_per_node: 4
  cpus_per_task: 8
  mem: "128G"
  time: "2-00:00:00"
  # job_name: experiment-specific

eval:
  batch_size: 8
  device: "cuda"
  seed: 42

data:
  # Fixed by the Sentinel-2 data format (sentinel/src/training/gap_aware_training.py) —
  # no meta.json derivation and no aux-variable concept, unlike ESDC.
  image_size: 128
  num_frames: 5
  in_channels: 10
  out_channels: 10
  normalize: true   # applied at LMDB-creation time; must match between data and eval scripts
